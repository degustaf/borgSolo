<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Scvmbook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/borg_solo.css">
</head>

<body>
  <div id="app"></div>

  <script src="elm.js"></script>
  <script>
    const key = "Scvmbook"
    const storedData = localStorage.getItem(key);
    const flags = storedData ? JSON.parse(storedData) : null;

    var app = Elm.Main.init({
      node: document.getElementById("app"),
      flags: flags
    });

    app.ports.saveState.subscribe(val => {
      localStorage.setItem(key, JSON.stringify(val));
    });
    app.ports.log.subscribe(msg => console.log(msg));

    app.ports.exportState.subscribe(val => {
      const blob = new Blob([JSON.stringify(val, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "scvmbook.json";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    app.ports.openFile.subscribe(() => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".json,application/json";
      input.addEventListener("change", () => {
        const file = input.files[0];
        if (file) {
          file.text()
            .then(text => app.ports.fileLoaded.send(text))
            .catch(() => app.ports.fileLoaded.send(""));
        }
      });
      input.click();
    });
  </script>
</body>

</html>
